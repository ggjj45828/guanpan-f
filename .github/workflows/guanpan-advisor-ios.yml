name: Guanpan F native iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'GuanpanFApp/**'
      - 'nas/**'
      - 'Tools/test_minute_service.py'
      - '.github/workflows/guanpan-advisor-ios.yml'
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'GuanpanFApp/**'
      - 'nas/**'
      - 'Tools/test_benchmark_history.py'
      - '.github/workflows/guanpan-advisor-ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test F core and build iOS targets
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Verify NAS readiness and bounded coverage diagnostics
        run: |
          python3 -m unittest -v \
            Tools.test_minute_service.MinuteServiceTests.test_backfill_status_reads_coverage_projection_without_recomputing_every_day \
            Tools.test_minute_service.MinuteServiceTests.test_readyz_uses_bounded_archive_probe \
            Tools.test_minute_service.MinuteServiceTests.test_readyz_fails_closed_when_calendar_does_not_review_current_year

      - name: Verify NAS benchmark daily archive
        run: python3 -m unittest -v Tools.test_benchmark_history

      - name: Verify ledger and Advisor architecture boundaries
        run: python3 Tools/verify_architecture_boundaries.py

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run F Swift package tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee F-core-tests.log

      - name: Generate F Xcode project
        working-directory: GuanpanFApp
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project GuanpanF.xcodeproj

      - name: Build unsigned iOS device app
        working-directory: GuanpanFApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project GuanpanF.xcodeproj \
            -scheme GuanpanF \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-device.log

      - name: Build iOS Simulator app
        working-directory: GuanpanFApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project GuanpanF.xcodeproj \
            -scheme GuanpanF \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-simulator.log

      - name: Run F app navigation UI tests
        working-directory: GuanpanFApp
        run: |
          set -o pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for group in data["devices"].values() for device in group if device.get("isAvailable") and device.get("name", "").startswith("iPhone")), ""))')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator on this runner" >&2
            exit 1
          fi
          xcodebuild test \
            -project GuanpanF.xcodeproj \
            -scheme GuanpanF \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/UITests \
            -resultBundlePath build/FApp-UI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-ui-tests.log

      - name: Export Simulator screenshots
        if: always()
        working-directory: GuanpanFApp
        run: |
          if [ -d build/FApp-UI.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/FApp-UI.xcresult \
              --output-path build/UI-Screenshots
          else
            echo "No UI result bundle was produced; there are no Simulator screenshots to export."
          fi

      - name: Package unsigned IPA
        working-directory: GuanpanFApp
        run: |
          APP_PATH="$(find build/Device/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Device build succeeded but no .app was produced" >&2
            exit 1
          fi
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          echo "IPA validation: display name=<$DISPLAY_NAME>"
          if [ "$DISPLAY_NAME" != "观盘max" ]; then echo "Unexpected app display name" >&2; exit 1; fi
          python3 - "$APP_PATH/Info.plist" "$APP_PATH" <<'PY'
          import pathlib
          import plistlib
          import sys

          info_path = pathlib.Path(sys.argv[1])
          app_path = pathlib.Path(sys.argv[2])
          info = plistlib.loads(info_path.read_bytes())
          icons = info.get("CFBundleIcons", {})
          primary = icons.get("CFBundlePrimaryIcon", {}) if isinstance(icons, dict) else {}
          icon_name = info.get("CFBundleIconName")
          icon_files = []
          if isinstance(primary, str):
              icon_name = icon_name or primary
          elif isinstance(primary, dict):
              icon_name = icon_name or primary.get("CFBundleIconName")
              icon_files = primary.get("CFBundleIconFiles", [])
          icon_files = icon_files or info.get("CFBundleIconFiles", [])
          print(f"IPA validation: bundle icon name={icon_name!r}; icon files={icon_files!r}")
          if icon_name == "AppIcon":
              print("IPA validation: built Info.plist selects AppIcon")
          elif icon_files:
              existing = [p.name for p in app_path.iterdir() if p.is_file()]
              matches = [name for name in icon_files if any(file.startswith(name) for file in existing)]
              if not matches:
                  print(f"App bundle files: {existing!r}", file=sys.stderr)
                  raise SystemExit("Info.plist icon files do not exist in the built app bundle")
              print(f"IPA validation: built icon files found: {matches!r}")
          else:
              print(f"Info.plist icon-related keys: {[key for key in info if 'Icon' in key]!r}", file=sys.stderr)
              raise SystemExit("Built Info.plist does not select AppIcon or declare primary icon files")
          PY
          python3 - Assets.xcassets/AppIcon.appiconset/Contents.json <<'PY'
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          images = manifest.get("images", [])
          icon = next((item for item in images if item.get("filename") == "AppIcon.png"), None)
          if icon is None or icon.get("idiom") != "universal" or icon.get("platform") != "ios":
              raise SystemExit("AppIcon manifest must reference a universal iOS AppIcon.png")
          if not (manifest_path.parent / "AppIcon.png").is_file():
              raise SystemExit("AppIcon.png is missing from the app icon set")
          print("IPA validation: source AppIcon manifest and PNG are valid")
          PY
          echo "Verified installed app label: $DISPLAY_NAME"
          mkdir -p build/Package/Payload
          cp -R "$APP_PATH" build/Package/Payload/
          cd build/Package
          ditto -c -k --sequesterRsrc --keepParent Payload ../观盘max.ipa
          unzip -t ../观盘max.ipa

      - name: Package F NAS deployment source
        if: success()
        run: |
          mkdir -p build
          printf 'source_revision=%s\n' "$GITHUB_SHA" > NAS-REVISION.txt
          zip -qr build/F-NAS-Deployment-Package.zip nas Tools/test_minute_service.py NAS-REVISION.txt
          unzip -l build/F-NAS-Deployment-Package.zip

      - name: Upload F NAS deployment package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f-nas-deployment-package
          path: build/F-NAS-Deployment-Package.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guanpan-f-ios-build-evidence
          path: |
            F-core-tests.log
            GuanpanFApp/build-device.log
            GuanpanFApp/build-simulator.log
            GuanpanFApp/build-ui-tests.log
            GuanpanFApp/build/FApp-UI.xcresult
            GuanpanFApp/build/UI-Screenshots/**
            GuanpanFApp/build/观盘max.ipa
          if-no-files-found: warn
          retention-days: 14
