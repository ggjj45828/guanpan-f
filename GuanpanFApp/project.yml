name: GuanpanF
options:
  bundleIdPrefix: com.guanpan
  deploymentTarget:
    iOS: "16.0"
packages:
  GuanpanFCore:
    path: ..
targets:
  GuanpanF:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: GuanpanFCore
        product: FCore
      - package: GuanpanFCore
        product: FAdvisor
      - package: GuanpanFCore
        product: FLedgerWrite
    info:
      path: GuanpanF-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "观盘max 可选连接您配置的 NAS 历史归档与研究服务；未连接 NAS 仍可使用本机账本、行情和顾问基础功能。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.advisor.f
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 观盘max
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  GuanpanFAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: GuanpanF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.advisor.f.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: GuanpanF
schemes:
  GuanpanF:
    build:
      targets:
        GuanpanF: all
    test:
      targets:
        - GuanpanFAppUITests
